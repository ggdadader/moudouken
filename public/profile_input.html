<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品味旅遊助手 - 建立個人檔案</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label.field-label {
      display: block;
      margin-bottom: 0.8rem;
      font-weight: bold;
      color: #34495e;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      color: #555;
    }

    .checkbox-item input {
      margin-right: 12px;
      transform: scale(1.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #219150;
    }

    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    .success {
      color: #27ae60;
    }

    .error {
      color: #e74c3c;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>建立您的品味檔案</h2>
    <form id="profileForm">
      <div class="form-group">
        <label class="field-label" for="nickname">暱稱 (Nickname)</label>
        <input type="text" id="nickname" name="nickname" placeholder="請輸入您的暱稱" required>
      </div>

      <div class="form-group">
        <label class="field-label">旅遊偏好 (Travel Preferences)</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="travel_prefs" value="都市漫步"> 都市漫步</label>
          <label class="checkbox-item"><input type="checkbox" name="travel_prefs" value="歷史古蹟"> 歷史古蹟</label>
          <label class="checkbox-item"><input type="checkbox" name="travel_prefs" value="戶外探險"> 戶外探險</label>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">藝術偏好 (Art Preferences)</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="art_prefs" value="ACG-科幻"> ACG-科幻</label>
          <label class="checkbox-item"><input type="checkbox" name="art_prefs" value="現代藝術"> 現代藝術</label>
          <label class="checkbox-item"><input type="checkbox" name="art_prefs" value="電影-獨立製片"> 電影-獨立製片</label>
        </div>
      </div>
      <div class="form-group">
        <label class="field-label" for="user_recommend">分享一個您的私藏景點/藝術空間</label>
        <input type="text" id="user_recommend" name="user_recommend" placeholder="例如：某家古著店或特色藝廊">
      </div>
      <button type="submit" id="submitBtn">儲存 Profile</button>
    </form>
    <div id="statusMessage"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase 配置資訊
    const firebaseConfig = {
      apiKey: "AIzaSyDLH0QU1G_mVos9WbvmqwZl0Fm-yh_-m64",
      authDomain: "moudouken.firebaseapp.com",
      projectId: "moudouken",
      storageBucket: "moudouken.firebasestorage.app",
      messagingSenderId: "72234130648",
      appId: "1:72234130648:web:222bb9de00befe0a0d0bad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMessage');
      btn.disabled = true;
      btn.textContent = "儲存中...";

      // 收集資料
      const nickname = document.getElementById('nickname').value;
      const travelPrefs = Array.from(document.querySelectorAll('input[name="travel_prefs"]:checked')).map(cb => cb.value);
      const artPrefs = Array.from(document.querySelectorAll('input[name="art_prefs"]:checked')).map(cb => cb.value);
      const userRecommend = document.getElementById('user_recommend').value;

      try {
        await addDoc(collection(db, 'User_Profiles'), {
          nickname: nickname,
          travel_prefs: travelPrefs,
          art_prefs: artPrefs,
          user_recommend: userRecommend, // 把私藏景點存進去
          created_at: new Date()
        });

        msg.innerHTML = '<span class="success">儲存成功！正在跳轉...</span>';

        // 成功後跳轉到推薦頁面 (請確保該檔案存在)
        setTimeout(() => {
          window.location.href = 'recommendations.html';
        }, 1500);

      } catch (error) {
        msg.innerHTML = '<span class="error">錯誤：' + error.message + '</span>';
        btn.disabled = false;
        btn.textContent = "儲存 Profile";
      }
    });
  </script>
</body>

</html>
