<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品味旅遊助手 - 建立個人檔案</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>建立您的品味檔案</h2>
    <form id="profileForm">
      <div class="form-group">
        <label for="nickname">暱稱 (Nickname)</label>
        <input type="text" id="nickname" name="nickname" placeholder="請輸入您的暱稱" required>
      </div>
      <button type="submit" id="submitBtn">儲存 Profile</button>
    </form>
    <div id="statusMessage"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDLH0QU1G_mVos9WbvmqwZl0Fm-yh_-m64",
      authDomain: "moudouken.firebaseapp.com",
      projectId: "moudouken",
      storageBucket: "moudouken.firebasestorage.app",
      messagingSenderId: "72234130648",
      appId: "1:72234130648:web:222bb9de00befe0a0d0bad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMessage');
      btn.disabled = true;
      try {
        await addDoc(collection(db, 'User_Profiles'), {
          nickname: document.getElementById('nickname').value,
          created_at: new Date()
        });
        msg.innerHTML = '<span class="success">儲存成功！</span>';
      } catch (error) {
        msg.innerHTML = '<span class="error">錯誤：' + error.message + '</span>';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
