<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <style>

      font-family: sans-serif;

      justify-content: center;

      background-color: #eef2f5;
      margin: 0;
    }

    .hero {
      text-align: center;
      background: white;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }

    p {
      color: #7f8c8d;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 12px 30px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }

</head>
