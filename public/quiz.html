<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品味定位中 | Taste Profiling</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
    }

    .quiz-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 進度條 */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: #3498db;
      transition: width 0.5s ease;
      width: 0%;
    }

    /* 題目容器 */
    .question-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .question-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: 2px;
      z-index: 10;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* 左右對決選項 */
    .options-container {
      display: flex;
      width: 100%;
      height: 70vh;
      gap: 10px;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .option-card {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), flex 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .option-card:hover {
      flex: 1.5;
      border-color: #3498db;
    }

    .option-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
      transition: 0.4s;
    }

    .option-card:hover img {
      filter: brightness(1);
      transform: scale(1.05);
    }

    .option-text {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 0;
    }

    /* 載入動畫 */
    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="progress-bar" id="progress"></div>

  <div class="quiz-container">
    <div id="quiz-ui" class="question-wrap">
      <div class="question-title" id="q-title">加載中...</div>
      <div class="options-container" id="options-box">
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p>正在分析您的美學 DNA...</p>
    </div>
  </div>

  <script type="module">
    const questions = [
      {
        title: "領域一：視覺美學觀",
        options: [
          { text: "魏斯安德森的浪漫對稱", tags: ["暖色", "懷舊", "細節"], img: "https://images.unsplash.com/photo-1518112166137-85899e0782aa?auto=format&fit=crop&w=800&q=80" },
          { text: "沙丘般的壯闊極簡", tags: ["冷色", "極簡", "科技"], img: "https://images.unsplash.com/photo-1444491741275-3747c53c99b4?auto=format&fit=crop&w=800&q=80" }
        ]
      },
      {
        title: "領域二：空間包裹感",
        options: [
          { text: "明亮通透的玻璃屋", tags: ["自然", "明亮", "極簡"], img: "https://images.unsplash.com/photo-1582037928867-677042c133df?auto=format&fit=crop&w=800&q=80" },
          { text: "沈穩神祕的爵士地窖", tags: ["昏暗", "細節", "懷舊"], img: "https://images.unsplash.com/photo-1514525253361-b83f859b71c0?auto=format&fit=crop&w=800&q=80" }
        ]
      },
      {
        title: "領域三：生活節奏感",
        options: [
          { text: "皮革與手寫的溫度", tags: ["類比", "人文", "細節"], img: "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=800&q=80" },
          { text: "精確冷冽的數位秩序", tags: ["科技", "秩序", "冷色"], img: "https://images.unsplash.com/photo-1526506118085-60ce8714f8c5?auto=format&fit=crop&w=800&q=80" }
        ]
      }
    ];

    const taipeiDatabase = [
      { name: "忠泰美術館", tags: ["冷色", "極簡", "科技", "秩序"], desc: "極致的冷色調與現代建築。", url: "recommendations.html?id=jut" },
      { name: "孵珈琲洋館", tags: ["暖色", "懷舊", "細節", "人文"], desc: "昭和風情的復古美學。", url: "recommendations.html?id=fufu" },
      { name: "Uncanny 忠泰樂生活", tags: ["自然", "明亮", "極簡", "秩序"], desc: "純白與呼吸感的策展空間。", url: "recommendations.html?id=uncanny" },
      { name: "隱士酒吧", tags: ["昏暗", "細節", "懷舊", "人文"], desc: "適合深度對話的隱密空間。", url: "recommendations.html?id=hermit" }
    ];

    let currentStep = 0;
    let userScore = [];

    function renderQuestion() {
      const q = questions[currentStep];
      document.getElementById('q-title').innerText = q.title;
      document.getElementById('progress').style.width = `${(currentStep / questions.length) * 100}%`;

      const box = document.getElementById('options-box');
      box.innerHTML = '';

      q.options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option-card';
        div.innerHTML = `<img src="${opt.img}"><div class="option-text">${opt.text}</div>`;
        div.onclick = () => selectOption(opt.tags);
        box.appendChild(div);
      });
    }

    function selectOption(tags) {
      userScore = userScore.concat(tags);
      currentStep++;
      if (currentStep < questions.length) {
        renderQuestion();
      } else {
        finalizeResults();
      }
    }

    function finalizeResults() {
      document.getElementById('quiz-ui').style.display = 'none';
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('progress').style.width = '100%';

      // 計算匹配地點
      const match = taipeiDatabase.map(place => {
        let score = place.tags.filter(t => userScore.includes(t)).length;
        return { ...place, score };
      }).sort((a, b) => b.score - a.score)[0];

      // 模擬分析時間並導向結果頁
      setTimeout(() => {
        localStorage.setItem('quizResult', JSON.stringify(match));
        window.location.href = 'recommendations.html';
      }, 2000);
    }

    renderQuestion();
  </script>
</body>

</html>
