<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>您的品味地圖 | Taste Matching</title>
  <style>
    :root {
      --primary: #3498db;
      --bg: #0a0a0a;
      --card-bg: #1a1a1a;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      margin-top: 50px;
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .header h1 {
      font-size: 0.9rem;
      letter-spacing: 5px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0;
    }

    .result-container {
      width: 90%;
      max-width: 500px;
      margin-top: 40px;
      animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* 核心推薦卡片 */
    .main-card {
      background: var(--card-bg);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-img {
      width: 100%;
      height: 250px;
      background: #333;
      object-fit: cover;
    }

    .content {
      padding: 30px;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 50px;
      background: rgba(52, 152, 219, 0.1);
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .place-name {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .place-desc {
      font-size: 0.95rem;
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* 按鈕群 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 16px;
      border-radius: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #444;
      color: #fff;
    }

    .btn-outline:hover {
      background: #222;
    }

    .footer-link {
      margin-top: 40px;
      padding-bottom: 50px;
      text-align: center;
    }

    .footer-link a {
      color: #555;
      text-decoration: none;
      font-size: 0.85rem;
      transition: 0.3s;
    }

    .footer-link a:hover {
      color: var(--primary);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Match Result</h1>
    <p id="match-status">找到最契合的靈魂座標</p>
  </div>

  <div class="result-container">
    <div class="main-card">
      <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80"
        class="hero-img" alt="推薦地點">
      <div class="content">
        <div class="tag-row" id="tag-container">
        </div>
        <div class="place-name" id="place-name">載入中...</div>
        <div class="place-desc" id="place-desc">正在從數據中提取最適合您的空間...</div>

        <div class="btn-group">
          <a href="#" id="google-map" class="btn btn-primary" target="_blank">📍 開啟地圖導航</a>
          <a href="quiz.html" class="btn btn-outline">🔄 重新定位品味</a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-link">
    <a href="login.html">🔐 登入帳號以永久儲存此地點</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resultData = JSON.parse(localStorage.getItem('quizResult'));

      if (resultData) {
        document.getElementById('place-name').innerText = resultData.name;
        document.getElementById('place-desc').innerText = resultData.desc;

        // 處理地圖連結
        const mapLink = document.getElementById('google-map');
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(resultData.name + " 台北")}`;

        // 注入標籤
        const tagContainer = document.getElementById('tag-container');
        resultData.tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.innerText = `#${tag}`;
          tagContainer.appendChild(span);
        });
      } else {
        window.location.href = 'quiz.html';
      }
    });
  </script>
</body>

</html>
