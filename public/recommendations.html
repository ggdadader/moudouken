<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品味推薦結果</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      max-width: 600px;
      margin: 30px auto;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .welcome-text {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .recommendation-box {
      background: #f9f9f9;
      border-left: 5px solid #27ae60;
      padding: 20px;
      text-align: left;
      border-radius: 8px;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #2980b9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>專屬您的品味推薦</h1>
    <p class="welcome-text">你好，<span id="userName">旅行者</span>！</p>

    <div class="recommendation-box">
      <h3>✨ 為您推薦</h3>
      <p id="recommend-content">載入中...</p>
      <div id="feedback-actions" style="display:none; gap: 10px;">
        <button onclick="submitFeedback(true)"
          style="background:#27ae60; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">❤️
          喜歡，收進口袋</button>
        <button onclick="submitFeedback(false)"
          style="background:#95a5a6; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">✖
          不感興趣</button>
      </div>
    </div>
    <div class="card" id="quiz-box">
      <h4>測測你的品味細節：</h4>
      <p id="question-text">你更喜歡「安靜的古著店」還是「熱鬧的創意市集」？</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button onclick="savePreference('古著店')" class="back-btn" style="background:#8e44ad;">古著店</button>
        <button onclick="savePreference('市集')" class="back-btn" style="background:#d35400;">市集</button>
      </div>
    </div>

    <a href="profile_input.html" class="back-btn">重新填寫檔案</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* 你的 Config 保持不變 */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchRecommendation() {
      try {
        // 1. 抓取「目前使用者」的最新資料
        const qLatest = query(collection(db, "User_Profiles"), orderBy("created_at", "desc"), limit(1));
        const snapLatest = await getDocs(qLatest);

        if (snapLatest.empty) return;
        const currentUser = snapLatest.docs[0].data();
        document.getElementById('userName').textContent = currentUser.nickname;

        // 2. 尋找「偏好相似」的其他使用者
        // 這裡我們先簡單用「其中一個旅遊偏好一樣」來當作相似
        const myFirstPref = currentUser.travel_prefs[0] || "都市漫步";

        const qSimilar = query(
          collection(db, "User_Profiles"),
          where("travel_prefs", "array-contains", myFirstPref),
          limit(5)
        );

        const snapSimilar = await getDocs(qSimilar);
        let suggestions = [];

        snapSimilar.forEach(doc => {
          const data = doc.data();
          // 排除掉自己，且要有推薦內容
          if (data.nickname !== currentUser.nickname && data.user_recommend) {
            suggestions.push(`${data.nickname} 推薦了：${data.user_recommend}`);
          }
        });
    async function savePreference(value) {
          // 1. 找到目前使用者的 ID (或用之前的最新一筆)
          // 2. 使用 updateDoc 把這個 value 加進他的 preferences 陣列
          // 3. 換下一題 (切換 question-text)
        }
    async function submitFeedback(isPositive) {
          const feedbackData = {
            user_id: currentUserNickname, // 或是你的 User ID
            target_recommendation: currentShownRecommend,
            is_positive: isPositive,
            timestamp: new Date()
          };

          // 存入 Firebase
          await addDoc(collection(db, 'User_Feedbacks'), feedbackData);

          alert(isPositive ? "已加入您的收藏！" : "了解，下次換個口味！");
          // 之後可以觸發「下一題」
          showNextQuestion();
        }
        // 3. 顯示結果
        const recommendBox = document.querySelector('.recommendation-box p');
        if (suggestions.length > 0) {
          recommendBox.innerHTML = "根據與您偏好相似的使用者推薦：<br>● " + suggestions.join("<br>● ");
        } else {
          recommendBox.textContent = "目前還沒有跟你偏好相似的人分享，快邀請朋友來填寫吧！";
        }

      } catch (error) {
        console.error(error);
      }
    }
    window.onload = fetchRecommendation;
  </script>
</body>

</html>
