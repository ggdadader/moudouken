<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLH0QU1G_mVos9WbvmqwZl0Fm-yh_-m64",
    authDomain: "moudouken.firebaseapp.com",
    projectId: "moudouken",
    storageBucket: "moudouken.firebasestorage.app",
    messagingSenderId: "72234130648",
    appId: "1:72234130648:web:222bb9de00befe0a0d0bad"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function fetchLatestProfile() {
    try {
      // 1. 從 User_Profiles 集合中，依照時間排序，抓取最新的一筆
      const q = query(collection(db, "User_Profiles"), orderBy("created_at", "desc"), limit(1));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        const latestData = querySnapshot.docs[0].data();

        // 2. 更新頁面上的暱稱
        document.getElementById('userName').textContent = latestData.nickname || "旅行者";

        // 3. (進階) 根據偏好顯示不同推薦 (範例)
        const travelPrefs = latestData.travel_prefs || [];
        const recommendText = document.querySelector('.recommendation-box p');

        if (travelPrefs.includes("戶外探險")) {
          recommendText.textContent = "嘿！既然你喜歡戶外探險，今天推薦你去象山步道走走，俯瞰整個城市美景！";
        } else if (travelPrefs.includes("歷史古蹟")) {
          recommendText.textContent = "既然你對歷史感興趣，大稻埕的古宅建築與茶文化非常適合你。";
        }
      }
    } catch (error) {
      console.error("讀取資料失敗:", error);
    }
  }

  fetchLatestProfile();
</script>
