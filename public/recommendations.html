<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品味配對結果</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7f6;
      padding: 20px;
      text-align: center;
      color: #2c3e50;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      max-width: 500px;
      margin: 30px auto;
    }

    .recommendation-box {
      background: #fff;
      border: 1px solid #eee;
      padding: 20px;
      text-align: left;
      border-radius: 12px;
      margin: 20px 0;
      border-left: 6px solid #3498db;
    }

    .tag {
      display: inline-block;
      background: #e1f5fe;
      color: #01579b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 2px;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    .map-link {
      color: #e67e22;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
    }

    #loading {
      font-style: italic;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>品味配對成功！</h1>
    <p class="welcome-text">你好，<span id="userName">...</span></p>
    <p style="font-size: 0.9rem; color: #7f8c8d;">您的品味標籤：<br><span id="userTags"></span></p>

    <div id="loading">正在搜尋相似靈魂的推薦...</div>
    <div id="recommend-list"></div>

    <a href="quiz.html" class="back-btn">重新測驗</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDLH0QU1G_mVos9WbvmqwZl0Fm-yh_-m64",
      authDomain: "moudouken.firebaseapp.com",
      projectId: "moudouken",
      storageBucket: "moudouken.firebasestorage.app",
      messagingSenderId: "72234130648",
      appId: "1:72234130648:web:222bb9de00befe0a0d0bad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function init() {
      try {
        // 1. 抓取最新測驗者
        const qLatest = query(collection(db, "User_Profiles"), orderBy("created_at", "desc"), limit(1));
        const snapLatest = await getDocs(qLatest);
        if (snapLatest.empty) return;

        const currentUser = snapLatest.docs[0].data();
        document.getElementById('userName').textContent = currentUser.nickname;

        // 顯示標籤
        const tagsContainer = document.getElementById('userTags');
        currentUser.travel_prefs.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = '#' + tag;
          tagsContainer.appendChild(span);
        });

        // 2. 尋找相似推薦 (找出至少有一個標籤相同的人)
        const qSimilar = query(
          collection(db, "User_Profiles"),
          where("travel_prefs", "array-contains-any", currentUser.travel_prefs),
          limit(10)
        );

        const snapSimilar = await getDocs(qSimilar);
        const listDiv = document.getElementById('recommend-list');
        document.getElementById('loading').style.display = 'none';

        let found = false;
        snapSimilar.forEach(doc => {
          const data = doc.data();
          // 排除自己，且對方必須有推薦景點
          if (data.nickname !== currentUser.nickname && data.user_recommend) {
            found = true;
            const item = document.createElement('div');
            item.className = 'recommendation-box';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.user_recommend)}`;

            item.innerHTML = `
                            <div style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">
                                與您品味相似的 <strong>${data.nickname}</strong> 推薦了：
                            </div>
                            <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 8px;">
                                ${data.user_recommend}
                            </div>
                            <a href="${mapUrl}" target="_blank" class="map-link">📍 在地圖上查看</a>
                        `;
            listDiv.appendChild(item);
          }
        });

        if (!found) {
          listDiv.innerHTML = "<p style='color:#888;'>目前還沒有相似的人分享推薦，去當第一個分享的人吧！</p>";
        }

      } catch (error) {
        console.error("載入失敗:", error);
      }
    }

    window.onload = init;
  </script>
</body>

</html>
